[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluepearl-mcp"
version = "0.1.0"
description = "MCP server that runs Blue Pearl Analyze (BluePearlCLI) and returns its results to AI models"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "pydantic>=2", "httpx>=0.25"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
bluepearl-mcp = "bluepearl_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bluepearl_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
